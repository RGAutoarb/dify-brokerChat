    - data:
        code: |
          def main(context: list) -> dict:
              if not context or len(context) == 0:
                  return {"has_context": False, "context_text": ""}

              parts = []
              for item in context:
                  if isinstance(item, dict):
                      text = (
                          item.get("content", "")
                          or item.get("text", "")
                          or item.get("page_content", "")
                          or str(item)
                      )
                      parts.append(text)
                  elif isinstance(item, str):
                      parts.append(item)
                  else:
                      parts.append(str(item))

              combined = "\n\n".join(part for part in parts if part).strip()

              if len(combined) > 50:
                  return {"has_context": True, "context_text": combined}

              return {"has_context": False, "context_text": ""}
        code_language: python3
        outputs:
          context_text:
            children: null
            type: string
          has_context:
            children: null
            type: boolean
        selected: false
        title: Context Validator
        type: code
        variables:
        - value_selector:
          - kr_node
          - result
          value_type: array[object]
          variable: context
