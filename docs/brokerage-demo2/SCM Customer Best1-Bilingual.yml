      Veuillez sélectionner votre langue pour continuer / Please select your language to continue.

      - Français
      - English

      Votre choix restera actif pour toute la conversation. Pour changer, démarrez une nouvelle conversation.
      Your choice stays active for the whole conversation. To change, start a new chat.
