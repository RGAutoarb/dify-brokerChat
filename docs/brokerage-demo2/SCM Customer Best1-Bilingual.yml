app:
  description: Bilingual (English/French) customer support chatbot for Sahel Capital
    Markets (SCM). Asks the user to pick a language on the first turn, locks that
    choice for the rest of the conversation, then routes both languages through a
    single pipeline (question classifier, knowledge retrieval across EN + FR datasets,
    language-aware primary and fallback LLMs).
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: SCM Customer Best1-Bilingual
  use_icon_as_answer_icon: false
