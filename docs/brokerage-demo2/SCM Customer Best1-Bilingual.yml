    - data:
        code: |
          def main(query: str, current_lang: str, current_locked: str) -> dict:
              q = (query or "").strip().lower().rstrip("?.! ")
              locked = "yes" if current_locked == "yes" else "no"
              lang = current_lang if current_lang in {"en", "fr"} else ""

              english_picks = {
                  "english", "en", "anglais", "english please",
                  "in english", "speak english", "i want english",
              }
              french_picks = {
                  "français", "francais", "fr", "french",
                  "en français", "en francais", "je veux le français",
                  "français s'il vous plaît", "francais s'il vous plait",
              }

              if locked == "yes":
                  return {
                      "next_lang": lang,
                      "next_locked": "yes",
                      "needs_selection": False,
                      "just_acked": False,
                      "ack_message": "",
                  }

              if q in english_picks:
                  return {
                      "next_lang": "en",
                      "next_locked": "yes",
                      "needs_selection": False,
                      "just_acked": True,
                      "ack_message": "Language set to English. Please ask your question.",
                  }

              if q in french_picks:
                  return {
                      "next_lang": "fr",
                      "next_locked": "yes",
                      "needs_selection": False,
                      "just_acked": True,
                      "ack_message": "Langue réglée sur le français. Veuillez poser votre question.",
                  }

              return {
                  "next_lang": "",
                  "next_locked": "no",
                  "needs_selection": True,
                  "just_acked": False,
                  "ack_message": "",
              }
        code_language: python3
        outputs:
          ack_message:
            children: null
            type: string
          just_acked:
            children: null
            type: boolean
          needs_selection:
            children: null
            type: boolean
          next_lang:
            children: null
            type: string
          next_locked:
