    - data:
        code: "def main(query: str, current_lang: str) -> dict:\n    lang = current_lang\
          \ if current_lang in {\"fr\", \"en\"} else \"fr\"\n    query_lower = query.lower().strip()\n\
          \n    switch_to_en = [\"english\", \"anglais\", \"in english\", \"speak\
          \ english\"]\n    switch_to_fr = [\"français\", \"francais\", \"french\"\
          , \"en français\", \"parle français\"]\n\n    english_offtopic = \"Thank\
          \ you for reaching out. I'm specifically designed to help with Sahel Capital\
          \ Markets (SCM) services, including account opening, deposits, withdrawals,\
          \ fees, buying or selling investments, portfolio questions, and investment\
          \ risk. Your question doesn't appear to be related to SCM's services. Please\
          \ ask me something about your SCM account, funding, trading, portfolio,\
          \ or investment risk if you'd like help.\"\n    french_offtopic = \"Merci\
          \ de nous avoir contactés. Je suis spécialement conçu pour vous aider avec\
          \ les services de Sahel Capital Markets (SCM), notamment l'ouverture de\
          \ compte, les dépôts, les retraits, les frais, l'achat ou la vente d'investissements,\
          \ les questions de portefeuille et le risque d'investissement. Votre question\
          \ ne semble pas liée aux services de SCM. Posez-moi une question sur votre\
          \ compte SCM, votre financement, votre trading, votre portefeuille ou le\
          \ risque d'investissement si vous souhaitez de l'aide.\"\n\n    for signal\
          \ in switch_to_en:\n        if signal in query_lower:\n            return\
          \ {\n                \"detected_lang\": \"en\",\n                \"is_lang_switch\"\
          : True,\n                \"switch_message\": \"Language switched to English.\
          \ How can I help you?\",\n                \"offtopic_response\": english_offtopic,\n\
          \            }\n\n    for signal in switch_to_fr:\n        if signal in\
          \ query_lower:\n            return {\n                \"detected_lang\"\
          : \"fr\",\n                \"is_lang_switch\": True,\n                \"\
          switch_message\": \"Langue changée en français. Comment puis-je vous aider\
          \ ?\",\n                \"offtopic_response\": french_offtopic,\n      \
          \      }\n\n    return {\n        \"detected_lang\": lang,\n        \"\
          is_lang_switch\": False,\n        \"switch_message\": \"\",\n        \"\
          offtopic_response\": french_offtopic if lang == \"fr\" else english_offtopic,\n\
          \    }"
        code_language: python3
