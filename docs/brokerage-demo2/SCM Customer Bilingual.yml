app:
  description: Bilingual customer support chatbot for Sahel Capital Markets (SCM).
    Answers questions about accounts, deposits, withdrawals, fees, equities, bonds,
    and investment risk using English and French knowledge bases and routes customers
    to the right team members when needed.
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: SCM Customer Bilingual
  use_icon_as_answer_icon: false
