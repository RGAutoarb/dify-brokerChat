        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 'Bienvenue chez le support Sahel Capital Markets. Je peux vous
      aider avec:


      1. Compte & Vérification — ouverture de compte, KYC, problèmes de connexion

      2. Dépôts, Retraits & Frais — financement, retrait, frais

      3. Achat ou Vente d''Investissements — actions, obligations, passation d''ordres

      4. Portefeuille, Dividendes & Coupons — avoirs, paiements, performances

      5. Risque & Sécurité — protection des investissements, diversification, risque
      de change


      Le français est la langue par défaut. Tapez "English" à tout moment pour passer
      à l''anglais.


      Comment puis-je vous aider aujourd''hui ?'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      config:
        inputs_config:
          enabled: true
          preset_response: Please keep your message professional and focused on SCM
            support.
        keywords: scam fraud terrorist financing
        outputs_config:
          enabled: false
          preset_response: ''
      enabled: true
      type: keywords
    speech_to_text:
      enabled: false
    suggested_questions:
    - Comment ouvrir un compte ?
    - Quelles actions puis-je acheter ?
    - Quels sont vos frais ?
    - Mon argent est-il en sécurité ?
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
