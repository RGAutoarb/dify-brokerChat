        code: "def main(query: str, current_lang: str, current_locked: str) -> dict:\n\
          \    query_lower = (query or \"\").strip().lower()\n    lang = current_lang\
          \ if current_lang in {\"fr\", \"en\"} else \"fr\"\n    locked = \"yes\"\
          \ if current_locked == \"yes\" else \"no\"\n\n    english_choices = {\n\
          \        \"english\",\n        \"english please\",\n        \"speak english\"\
          ,\n        \"i want english\",\n        \"anglais\",\n    }\n    french_choices\
          \ = {\n        \"français\",\n        \"francais\",\n        \"français\
          \ s'il vous plaît\",\n        \"francais s'il vous plaît\",\n        \"\
          french\",\n        \"je veux le français\",\n    }\n\n    result = {\n\
          \        \"next_lang\": lang,\n        \"next_locked\": locked,\n      \
          \  \"blocked_switch\": False,\n        \"choose_english\": False,\n   \
          \     \"choose_french\": False,\n        \"route_english\": lang == \"\
          en\",\n        \"lock_message\": \"\",\n    }\n\n    if locked == \"yes\"\
          :\n        if query_lower in english_choices or query_lower in french_choices:\n\
          \            result[\"blocked_switch\"] = True\n            if lang ==\
          \ \"en\":\n                result[\"lock_message\"] = \"This chat is locked\
          \ to English. Please start a new conversation if you would like French.\"\
          \n            else:\n                result[\"lock_message\"] = \"Cette\
          \ conversation est verrouillée en français. Veuillez démarrer une nouvelle\
          \ conversation si vous souhaitez l'anglais.\"\n        return result\n\n\
          \    if query_lower in english_choices:\n        result[\"next_lang\"]\
          \ = \"en\"\n        result[\"next_locked\"] = \"yes\"\n        result[\"\
          choose_english\"] = True\n        result[\"route_english\"] = False\n \
          \       return result\n\n    if query_lower in french_choices:\n      \
          \  result[\"next_lang\"] = \"fr\"\n        result[\"next_locked\"] = \"\
          yes\"\n        result[\"choose_french\"] = True\n        result[\"route_english\"\
          ] = False\n        return result\n\n    result[\"next_lang\"] = \"fr\"\n\
          \    result[\"next_locked\"] = \"yes\"\n    result[\"route_english\"] =\
          \ False\n    return result"
