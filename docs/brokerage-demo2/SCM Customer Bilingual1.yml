app:
  description: Bilingual customer support chatbot for Sahel Capital Markets (SCM).
    Uses a first-turn language selection, locks the conversation language, and routes
    users through separate English and French support branches with dedicated knowledge
    bases.
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: SCM Customer Bilingual1
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openrouter:0.0.43@241af6052a82fa08c0d7c3756d7f2a57cc16d8b3c05d7fd58088ece28cae9e34
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables:
  - description: Selected language for the active conversation.
    id: e0c58fa6-68c2-48dd-90b6-f0b20d7d1f11
    name: lang
    selector:
    - conversation
    - lang
    value: fr
    value_type: string
  - description: Whether the conversation language has been locked.
    id: 0e4fa6c8-a9b8-4f44-bbc3-6eab3f9100f2
    name: lang_locked
    selector:
    - conversation
    - lang_locked
    value: 'no'
    value_type: string
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 'Veuillez sélectionner votre langue pour commencer / Please
      select your language to begin.


      - Français

      - English


      Le français est la langue par défaut. Une fois la langue choisie, elle reste
      fixe pour cette conversation.


      French is the default. Once chosen, the language stays fixed for this conversation.'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      config:
        inputs_config:
          enabled: true
          preset_response: Please keep your message professional and focused on SCM
            support.
        keywords: scam fraud terrorist financing
        outputs_config:
          enabled: false
          preset_response: ''
      enabled: true
      type: keywords
    speech_to_text:
      enabled: false
    suggested_questions:
    - Français
    - English
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
