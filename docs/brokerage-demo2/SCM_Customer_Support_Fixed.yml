          name: 'Account & Verification: Questions about opening an SCM account, KYC verification, identity documents, Ghana Card, login problems, password reset, joint accounts, corporate accounts, demo accounts, personal information updates, multi-currency wallets, account types.'
        - id: 'class_deposits'
          name: 'Deposits, Withdrawals & Fees: Questions about depositing money, withdrawing money, mobile money (MTN MoMo, Vodafone Cash, AirtelTigo), bank transfers, wire transfers, fees, commissions, charges, settlement periods, available balance, currency conversion fees, cheque deposits, payment methods.'
        - id: 'class_trading'
          name: 'Buying or Selling Investments: Questions about buying or selling shares, equities, stocks, bonds, placing orders, market orders, limit orders, stop-loss orders, subscription windows, trading hours, specific companies (Sonatel, Zenith, Ecobank, Consolidated Bank Ghana), tickers, GSE, NSE, BRVM, bond menu, coupon rates, maturity dates.'
        - id: 'class_portfolio'
          name: 'Portfolio, Dividends & Coupons: Questions about existing holdings, portfolio value, dividend payments, coupon payments, ex-dividend dates, bond maturity, investment performance, unreceived dividends, missing coupon payments, portfolio drops.'
        - id: 'class_risk'
          name: 'Risk & Safety: Questions about investment risk, safety of funds, diversification, currency risk, liquidity risk, whether money is protected, CSD custody, segregated accounts, what happens if SCM closes, whether bonds are safe, market drops, delisting, losing money.'
        instruction: 'You are classifying customer support queries for Sahel Capital Markets (SCM), a West African brokerage that offers equities and bonds only. No forex, no crypto, no CFDs, no options. Classify based on the user''s primary intent. If the query could fit multiple categories, choose the most actionable one.'
