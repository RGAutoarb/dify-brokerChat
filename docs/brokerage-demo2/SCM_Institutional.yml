    opening_statement: "Welcome to Sahel Capital Markets support. I can help you with:\n\
      \n1. Account & Verification \u2014 opening accounts, KYC, login issues\n2. Deposits,\
      \ Withdrawals & Fees \u2014 funding, withdrawing, charges\n3. Buying or Selling\
      \ Investments \u2014 equities, bonds, placing orders\n4. My Portfolio, Dividends\
      \ & Coupons \u2014 holdings, payments, performance\n5. Risk & Safety \u2014 investment\
      \ protection, diversification, currency risk\n\nHow can I help you today?"
