    - data:
        classes:
        - id: '1'
          name: 'Account & Verification: Questions about opening an SCM account, KYC
            verification, identity documents, Ghana Card, login problems, password
            reset, joint accounts, corporate accounts, demo accounts, personal information
            updates, multi-currency wallets, account types.'
        - id: '2'
          name: 'Deposits, Withdrawals & Fees: Questions about depositing money, withdrawing
            money, mobile money (MTN MoMo, Vodafone Cash, AirtelTigo), bank transfers,
            wire transfers, fees, commissions, charges, settlement periods, available
            balance, currency conversion fees, cheque deposits, payment methods, how
            many times you can withdraw.'
        - id: '1776083598053'
          name: 'Buying or Selling Investments: Questions about buying or selling
            shares, equities, stocks, bonds, placing orders, market orders, limit
            orders, stop-loss orders, subscription windows, trading hours, specific
            companies (Sonatel, Zenith, Ecobank, Consolidated Bank Ghana), tickers,
            GSE, NSE, BRVM, bond menu, coupon rates, maturity dates.'
        - id: '1776083612651'
          name: 'Portfolio, Dividends & Coupons: Questions about existing holdings,
            portfolio value, dividend payments, coupon payments, ex-dividend dates,
            bond maturity, investment performance, unreceived dividends, missing coupon
            payments, portfolio drops.'
        - id: '1776083618288'
          name: 'Risk & Safety: Questions about investment risk, safety of funds,
            diversification, currency risk, liquidity risk, whether money is protected,
            CSD custody, segregated accounts, what happens if SCM closes, whether
            bonds are safe, market drops, delisting, losing money.'
        - id: '1776090000001'
          name: 'Off-Topic or Not Related to SCM: Questions unrelated to Sahel Capital
            Markets, investing, accounts, trading, or financial services. Includes
            weather, sports, politics, entertainment, general trivia, personal questions
            to the chatbot, jokes, greetings without a question, or any topic outside
            SCM brokerage services.'
