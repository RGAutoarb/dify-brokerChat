app:
  description: Customer support chatbot for Sahel Capital Markets (SCM). Answers questions
    about accounts, deposits, withdrawals, fees, equities, bonds, and investment risk
    using a curated knowledge base and routes customers to the right team members when needed.
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: SCM Customer Support
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openrouter:0.0.43@241af6052a82fa08c0d7c3756d7f2a57cc16d8b3c05d7fd58088ece28cae9e34
    version: null
kind: app
version: 0.6.0
