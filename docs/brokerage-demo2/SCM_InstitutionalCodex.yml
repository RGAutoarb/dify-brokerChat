    - data:
        classes:
        - id: class_account
          name: 'Account & Verification: Questions about opening an SCM account, KYC
            verification, identity documents, Ghana Card, login problems, password
            reset, joint accounts, corporate accounts, multi-currency wallets, account
            types, onboarding, and client verification.'
        - id: class_deposits
          name: 'Deposits, Withdrawals & Fees: Questions about depositing money, withdrawing
            money, mobile money, bank transfers, wire transfers, fees, commissions,
            charges, settlement periods, available balance, currency conversion, and
            payment methods.'
        - id: class_trading
          name: 'Buying or Selling Investments: Questions about buying or selling
            shares, equities, stocks, bonds, placing orders, market orders, limit
            orders, trading hours, specific companies, tickers, and GSE, NSE, or
            BRVM instruments.'
        - id: class_portfolio
          name: 'Portfolio, Dividends & Coupons: Questions about holdings, portfolio
            value, dividend payments, coupon payments, ex-dividend dates, bond maturity,
            investment performance, and unreceived payments.'
        - id: class_risk
          name: 'Risk & Safety: Questions about investment risk, safety of funds,
            diversification, currency risk, liquidity risk, CSD custody, segregated
            accounts, and what happens if SCM closes.'
        - id: class_offtopic
          name: 'Off-Topic: Anything unrelated to SCM financial services, such as
            weather, sports, entertainment, politics, trivia, jokes, or personal
            chit-chat that is not about SCM accounts, investing, trading, portfolio,
            fees, or risk.'
        instruction: 'You are classifying customer support queries for Sahel Capital
          Markets (SCM), a West African brokerage that offers curated equities and
          bonds only. No forex, no CFDs, no options, no margin products, and no crypto.
          Classify based on the user''s primary intent. The six classes are mutually
          exclusive and collectively exhaustive. Only choose Off-Topic when the query
          is clearly unrelated to SCM''s financial services; if a question could fit
          an SCM category, prefer the closest in-scope SCM class.'
