    - data:
        code: "def main(context: list) -> dict:\n    if not context or len(context) == 0:\n        return {\"has_context\": False, \"context_text\": \"\"}\n\n    parts = []\n    for item in context:\n        if isinstance(item, dict):\n            text = (\n                item.get(\"content\", \"\")\n                or item.get(\"text\", \"\")\n                or item.get(\"page_content\", \"\")\n                or str(item)\n            )\n            parts.append(text)\n        elif isinstance(item, str):\n            parts.append(item)\n        else:\n            parts.append(str(item))\n\n    combined = \"\\n\\n\".join(part for part in parts if part).strip()\n\n    if len(combined) > 50:\n        return {\"has_context\": True, \"context_text\": combined}\n\n    return {\"has_context\": False, \"context_text\": \"\"}"
        code_language: python3
        outputs:
          context_text:
            children: null
            type: string
          has_context:
            children: null
            type: boolean
