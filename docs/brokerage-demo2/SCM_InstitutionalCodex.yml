    opening_statement: 'Welcome to Sahel Capital Markets support. I can help you with:


      1. Account & Verification — opening accounts, KYC, login issues

      2. Deposits, Withdrawals & Fees — funding, withdrawing, charges

      3. Buying or Selling Investments — equities, bonds, placing orders

      4. Portfolio, Dividends & Coupons — holdings, payments, performance

      5. Risk & Safety — investment protection, diversification, currency risk


      How can I help you today?'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: true
      type: keywords
      config:
        inputs_config:
          enabled: true
          preset_response: Please keep your message professional and focused on SCM support.
        outputs_config:
          enabled: false
          preset_response: ''
        keywords: scam
          fraud
          terrorist financing
    speech_to_text:
      enabled: false
    suggested_questions:
    - How do I open an account?
    - What shares can I buy?
    - What are your fees?
    - Is my money safe?
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
